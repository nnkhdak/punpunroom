<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>組織検索</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #333; }
    header { background: #2c6fad; color: #fff; padding: 16px 24px; }
    header h1 { font-size: 1.2rem; font-weight: bold; }
    main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 24px; }
    h2 { font-size: 1rem; margin-bottom: 20px; color: #2c6fad; border-left: 4px solid #2c6fad; padding-left: 10px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 9px 12px; border: 1px solid #ccc;
      border-radius: 4px; font-size: .95rem;
    }
    input[type="text"]:focus { outline: none; border-color: #2c6fad; box-shadow: 0 0 0 2px rgba(44,111,173,.2); }
    .btn-group { display: flex; gap: 10px; margin-top: 24px; }
    button {
      flex: 1; padding: 10px; border: none; border-radius: 4px;
      font-size: .95rem; cursor: pointer;
    }
    .btn-search { background: #2c6fad; color: #fff; }
    .btn-search:hover { background: #255e96; }
    .btn-clear { background: #e0e0e0; color: #333; }
    .btn-clear:hover { background: #cfcfcf; }
  </style>
</head>
<body>
  <header><h1>組織管理</h1></header>
  <main>
    <div class="card">
      <h2>組織検索</h2>
      <form id="searchForm">
        <div class="form-group">
          <label for="name">会社名</label>
          <input type="text" id="name" name="name" placeholder="例：株式会社タナカ">
        </div>
        <div class="form-group">
          <label for="phone">電話番号</label>
          <input type="text" id="phone" name="phone" placeholder="例：03-1000">
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-search">検索</button>
          <button type="button" class="btn-clear" id="clearBtn">クリア</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const clearBtn = document.getElementById('clearBtn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const params = new URLSearchParams();
      const name  = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if (name)  params.set('name', name);
      if (phone) params.set('phone', phone);
      location.href = 'organizations-list.html?' + params.toString();
    });

    clearBtn.addEventListener('click', () => {
      document.getElementById('name').value  = '';
      document.getElementById('phone').value = '';
    });
  </script>
</body>
</html>
